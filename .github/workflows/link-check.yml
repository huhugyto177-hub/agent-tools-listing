name: Daily link check

on:
  schedule:
    - cron: "0 9 * * *" # daily, 09:00 UTC
  workflow_dispatch: # allow a manual run from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source links
        run: python3 scripts/check-links.py
      - name: Commit updated status
        run: |
          git config user.name "agent-tools-bot"
          git config user.email "bot@agent-tools-listing.local"
          git add status.json catalog.json
          git diff --cached --quiet || (git commit -m "Daily link check: update status" && git push)
